[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-agent"
version = "1.0.0"
description = "Project-Integrated Autonomous QC & Audit Agent CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
qc-agent = "qc_agent.cli:app"

